name: Deploy Relief to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/picture-to-3d-model-c5q5o9
    paths:
      - 'photo-to-3d/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: photo-to-3d
      - id: deployment
        uses: actions/deploy-pages@v4
